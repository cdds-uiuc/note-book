version: 1
project:
  title: Climate Dynamics and Data Science Notes
  authors:
    - name: Cristian Proistosescu
  copyright: '2024'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  github: cdds-uiuc/note-book
  thebe:
    binder:
      repo: cdds-uiuc/note-book
      provider: github
      url: https://mybinder.org
      ref: main
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/note-book.pdf
  toc:
    - file: intro.md
    - file: content/Hasselmann/Hasselmann.md
      children:
        - file: content/Hasselmann/1_Mathematical_Prelims.ipynb
        - file: content/Hasselmann/2_Hasselmann_model.ipynb
        - file: content/Hasselmann/3_Simulating_Stochastic_Processes.ipynb
        - file: content/Hasselmann/4_Theory.ipynb
    - file: content/bayecs/bayecs.md
      children:
        - file: content/bayecs/SherwoodWebb_baselines_colab.ipynb
        - file: content/bayecs/Readme.md
site:
  options:
    logo: content/CDDS_logo.png
    favicon: content/CDDS_logo.png
    folders: true
  template: book-theme
